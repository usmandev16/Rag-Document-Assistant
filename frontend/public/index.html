<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Chats · Doc Chat</title>
    <script>
      // Set the theme before first paint so a saved dark-mode preference
      // doesn't flash light before React mounts and flips it.
      (function () {
        var theme = localStorage.getItem("theme");
        if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
